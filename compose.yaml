services:
  backend-1:
    build: .
    environment:
      SERVER_ID: backend-1
    networks:
      - tamarind-network

  backend-2:
    build: .
    environment:
      SERVER_ID: backend-2
    networks:
      - tamarind-network

  backend-3:
    build: .
    environment:
      SERVER_ID: backend-3
    networks:
      - tamarind-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - tamarind-network

networks:
  tamarind-network:
    driver: bridge